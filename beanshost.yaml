apiVersion: beanshost.io/v1alpha1
kind: Agent
metadata:
  name: ai-university-assistant
  displayName: AI University Assistant
  description: University-assistant test agent
  labels:
    product: university-assistant

spec:
  runtime:
    type: worker
    entrypoint: dist/index.js
    compatibility:
      webStandardApis: true

  source:
    type: github
    repository: Abhi03072001/ask-chatbot
    branch: main
    manifestPath: beanshost.yaml

  health:
    path: /health
    timeoutSeconds: 5

  scaling:
    minimumInstances: 0
    maximumInstances: 5
    concurrency: 25

  triggers:
    - type: http
      path: /invoke

  secrets: []

  resilience:
    retry:
      maximumAttempts: 3
    timeoutSeconds: 30
    modelFallback: false

  governance:
    registrationRequired: true
    approvalRequiredForProduction: true
    riskClassification: low

  observability:
    logs: true
    traces: true
    usageMetering: true
    captureContent: false